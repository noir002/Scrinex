name: CI

# Runs on every push and PR against main -- lint, run the unittest suite,
# and confirm the Docker image still builds. Nothing here pushes anywhere;
# that's cd.yml's job, gated on this passing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ruff is a CI-only tool -- it never ships in the Docker image, so the
      # app itself stays pure-stdlib per CLAUDE.md.
      - run: pip install ruff
      - run: ruff check nex.py pygit_core.py server.py tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: scrinex:ci
