<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrinex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a; --panel:#1b1e23; --panel-2:#20242b; --border:#2b2f37;
    --text:#e7e6e1; --text-dim:#9a9c9f; --text-faint:#63676d;
    --moss:#8fbf5f; --moss-dim:#5f8a3c; --moss-glow:#c8e6a3;
    --amber:#e0a955; --red:#e0715f; --blue:#6fa8dc;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;}
  a{color:var(--blue);text-decoration:none;}

  .topbar{
    display:flex;align-items:center;gap:16px;padding:14px 24px;
    border-bottom:1px solid var(--border);background:var(--panel);
    position:sticky;top:0;z-index:10;
  }
  .logo{font-family:var(--mono);font-weight:600;font-size:17px;color:var(--moss-glow);letter-spacing:0.5px;}
  .logo::before{content:"❯ ";color:var(--moss);}
  .branch-pill{
    font-family:var(--mono);font-size:12px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:20px;padding:4px 12px;color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .branch-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--moss);}
  .spacer{flex:1;}
  .refresh-btn{
    font-family:var(--sans);font-size:13px;background:transparent;color:var(--text-dim);
    border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;
  }
  .refresh-btn:hover{border-color:var(--moss-dim);color:var(--text);}
  .updated{font-size:12px;color:var(--text-faint);font-family:var(--mono);}

  .layout{display:flex;min-height:calc(100vh - 53px);}
  .sidebar{width:280px;border-right:1px solid var(--border);background:var(--panel);padding:16px 0;flex-shrink:0;}
  .sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);padding:0 20px;margin:0 0 8px;font-weight:600;}
  .tree{font-family:var(--mono);font-size:13px;}
  .tree-node{padding:3px 20px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-dim);}
  .tree-node:hover{background:var(--panel-2);color:var(--text);}
  .tree-node.active{background:var(--panel-2);color:var(--moss-glow);}
  .tree-node .icon{margin-right:6px;color:var(--text-faint);}
  .tree-node.dir .icon{color:var(--amber);}

  .main{flex:1;padding:24px 32px;min-width:0;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .tab{padding:8px 16px;font-size:13px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;}
  .tab.active{color:var(--moss-glow);border-bottom-color:var(--moss);}
  .tab:hover{color:var(--text);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;}
  pre.code{margin:0;padding:16px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--text);}

  .commit-row{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:12px;align-items:flex-start;}
  .commit-row:last-child{border-bottom:none;}
  .commit-row:hover{background:var(--panel-2);}
  .commit-graph{width:14px;flex-shrink:0;display:flex;justify-content:center;padding-top:4px;}
  .commit-graph .node{width:8px;height:8px;border-radius:50%;background:var(--moss);}
  .commit-body{flex:1;min-width:0;}
  .commit-msg{font-weight:500;color:var(--text);margin-bottom:4px;}
  .commit-meta{font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  .commit-hash{color:var(--amber);}

  .status-group{margin-bottom:20px;}
  .status-group h4{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin:0 0 8px;}
  .status-item{font-family:var(--mono);font-size:13px;padding:5px 0;color:var(--text-dim);display:flex;gap:8px;}
  .status-item .tag{width:64px;flex-shrink:0;font-size:11px;text-transform:uppercase;}
  .tag.new{color:var(--moss);} .tag.modified{color:var(--amber);} .tag.untracked{color:var(--text-faint);} .tag.deleted{color:var(--red);}
  .clean-msg{color:var(--text-faint);font-family:var(--mono);padding:8px 0;}

  .diff-line{white-space:pre;font-family:var(--mono);font-size:13px;line-height:1.6;padding:0 16px;}
  .diff-add{background:rgba(143,191,95,0.12);color:var(--moss-glow);}
  .diff-del{background:rgba(224,113,95,0.12);color:var(--red);}
  .diff-hunk{color:var(--blue);opacity:0.8;}
  .diff-file-header{padding:10px 16px;background:var(--panel-2);font-family:var(--mono);font-size:12px;color:var(--text-dim);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-dim);}
  .empty-state .logo{font-size:24px;display:block;margin-bottom:12px;}
  .empty-state code{font-family:var(--mono);background:var(--panel-2);padding:2px 8px;border-radius:4px;color:var(--moss-glow);}
  .muted{color:var(--text-faint);}
</style>
</head>
<body>
  <div class="sr-only" style="position:absolute;left:-9999px;">Scrinex, a web portal for browsing a nex repository: file tree, commit history, and diffs.</div>

  <div class="topbar">
    <span class="logo">scrinex</span>
    <span class="branch-pill" id="branchPill"><span class="dot"></span><span id="branchName">-</span></span>
    <span class="spacer"></span>
    <span class="updated" id="updatedAt"></span>
    <button class="refresh-btn" onclick="refreshAll()">refresh</button>
  </div>

  <div class="layout">
    <div class="sidebar">
      <h3>Files</h3>
      <div class="tree" id="fileTree"><div class="tree-node muted">loading…</div></div>
    </div>
    <div class="main">
      <div class="tabs">
        <div class="tab active" data-tab="code" onclick="switchTab('code')">Code</div>
        <div class="tab" data-tab="commits" onclick="switchTab('commits')">Commits</div>
        <div class="tab" data-tab="status" onclick="switchTab('status')">Changes</div>
      </div>

      <div id="view-code">
        <div class="panel">
          <div class="panel-header"><span id="codePath">select a file</span><span id="codeSize"></span></div>
          <pre class="code" id="codeContent">Pick a file from the tree on the left.</pre>
        </div>
      </div>

      <div id="view-commits" style="display:none;">
        <div class="panel" id="commitList"></div>
        <div style="height:20px;"></div>
        <div class="panel" id="commitDiffPanel" style="display:none;"></div>
      </div>

      <div id="view-status" style="display:none;">
        <div class="panel" style="padding:16px;" id="statusPanel"></div>
      </div>
    </div>
  </div>

<script>
const API = '/api';
let state = { tree: [], commits: [], branch: null };

async function api(path) {
  const res = await fetch(API + path);
  return res.json();
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['code','commits','status'].forEach(n => {
    document.getElementById('view-' + n).style.display = (n === name) ? '' : 'none';
  });
}

function renderTree(nodes, container, depth) {
  nodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'tree-node ' + (node.type === 'dir' ? 'dir' : 'file');
    el.style.paddingLeft = (20 + depth * 16) + 'px';
    el.innerHTML = `<span class="icon">${node.type === 'dir' ? '▸' : '·'}</span>${node.name}`;
    if (node.type === 'file') {
      el.onclick = () => openFile(node, el);
    } else {
      const childWrap = document.createElement('div');
      childWrap.style.display = 'none';
      renderTree(node.children || [], childWrap, depth + 1);
      el.onclick = () => {
        const open = childWrap.style.display !== 'none';
        childWrap.style.display = open ? 'none' : 'block';
        el.querySelector('.icon').textContent = open ? '▸' : '▾';
      };
      container.appendChild(el);
      container.appendChild(childWrap);
      return;
    }
    container.appendChild(el);
  });
}

async function openFile(node, el) {
  document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  switchTab('code');
  document.getElementById('codePath').textContent = node.name;
  document.getElementById('codeContent').textContent = 'loading…';
  const data = await api('/file?hash=' + node.hash);
  document.getElementById('codeSize').textContent = data.size + ' bytes';
  document.getElementById('codeContent').textContent = data.binary ? '<binary file>' : data.content;
}

function timeAgo(ts) {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function renderCommits(commits) {
  const list = document.getElementById('commitList');
  list.innerHTML = '';
  if (!commits.length) {
    list.innerHTML = '<div class="commit-row"><div class="commit-body muted">No commits yet.</div></div>';
    return;
  }
  commits.forEach(c => {
    const row = document.createElement('div');
    row.className = 'commit-row';
    row.innerHTML = `
      <div class="commit-graph"><div class="node"></div></div>
      <div class="commit-body">
        <div class="commit-msg">${escapeHtml(c.message.split('\n')[0])}</div>
        <div class="commit-meta"><span class="commit-hash">${c.hash.slice(0,7)}</span> · ${escapeHtml(c.author)} · ${timeAgo(c.timestamp)}</div>
      </div>`;
    row.onclick = () => showCommitDiff(c.hash);
    list.appendChild(row);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderDiffLine(line) {
  let cls = '';
  if (line.startsWith('+') && !line.startsWith('+++')) cls = 'diff-add';
  else if (line.startsWith('-') && !line.startsWith('---')) cls = 'diff-del';
  else if (line.startsWith('@@')) cls = 'diff-hunk';
  return `<div class="diff-line ${cls}">${escapeHtml(line) || ' '}</div>`;
}

async function showCommitDiff(hash) {
  const panel = document.getElementById('commitDiffPanel');
  panel.style.display = '';
  panel.innerHTML = '<div class="panel-header">loading diff…</div>';
  const data = await api('/commit/' + hash + '/diff');
  let html = `<div class="panel-header">diff for <span class="commit-hash">${hash.slice(0,7)}</span></div>`;
  if (!data.files.length) {
    html += '<div style="padding:16px" class="muted">No file changes (empty commit).</div>';
  }
  data.files.forEach(f => {
    html += `<div class="diff-file-header">${f.status}: ${escapeHtml(f.path)}</div>`;
    html += f.diff.slice(2).map(renderDiffLine).join('');
  });
  panel.innerHTML = html;
}

function renderStatus(s) {
  const el = document.getElementById('statusPanel');
  if (s.clean) {
    el.innerHTML = '<div class="clean-msg">nothing to commit, working tree clean</div>';
    return;
  }
  let html = '';
  const group = (title, items, render) => {
    if (!items.length) return '';
    return `<div class="status-group"><h4>${title}</h4>${items.map(render).join('')}</div>`;
  };
  html += group('Staged for commit', s.staged, i => `<div class="status-item"><span class="tag new">${i.status}</span>${escapeHtml(i.path)}</div>`);
  html += group('Not staged', s.unstaged, p => `<div class="status-item"><span class="tag modified">modified</span>${escapeHtml(p)}</div>`);
  html += group('Untracked', s.untracked, p => `<div class="status-item"><span class="tag untracked">new</span>${escapeHtml(p)}</div>`);
  html += group('Deleted', s.deleted, p => `<div class="status-item"><span class="tag deleted">deleted</span>${escapeHtml(p)}</div>`);
  el.innerHTML = html;
}

function renderEmpty() {
  document.getElementById('fileTree').innerHTML = '<div class="tree-node muted">no repo</div>';
  document.querySelector('.main').innerHTML = `
    <div class="empty-state">
      <span class="logo">❯ scrinex</span>
      <p>No repository found at this path yet.</p>
      <p>Run <code>nex init</code>, then <code>nex add .</code> and <code>nex commit -m "..."</code> in your project folder.</p>
    </div>`;
}

async function refreshAll() {
  const status = await api('/status');
  if (status.error && status.initialized === false) {
    renderEmpty();
    return;
  }
  document.getElementById('branchName').textContent = status.branch;
  renderStatus(status);

  const treeData = await api('/tree');
  document.getElementById('fileTree').innerHTML = '';
  if (!treeData.nodes.length) {
    document.getElementById('fileTree').innerHTML = '<div class="tree-node muted">empty</div>';
  } else {
    renderTree(treeData.nodes, document.getElementById('fileTree'), 0);
  }

  const logData = await api('/log?n=50');
  renderCommits(logData.commits);

  document.getElementById('updatedAt').textContent = 'updated ' + new Date().toLocaleTimeString();
}

refreshAll();
setInterval(refreshAll, 4000);
</script>
</body>
</html>
